<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>R1 Face Designer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111118;
      color: #bbc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Two-column layout ── */
    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Left panel — fixed, always visible ── */
    #left-panel {
      width: 288px;
      flex-shrink: 0;
      background: #0a0a10;
      border-right: 1px solid #1a1a28;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      gap: 16px;
    }

    #canvas-wrap {
      position: relative;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      width: 240px;
      height: 282px;
      flex-shrink: 0;
    }

    #canvas-wrap canvas {
      position: absolute;
      top: 0; left: 0;
      width: 240px;
      height: 282px;
      image-rendering: pixelated;
    }

    #grid-overlay { pointer-events: none; }

    /* ── Preview action buttons ── */
    #preview-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 6px;
    }

    .action-row .btn { flex: 1; }

    .btn {
      background: #18182a;
      color: #99a;
      border: 1px solid #242438;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }

    .btn:hover { background: #22223a; color: #ccd; }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #667;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 0;
    }

    .toggle-row input { cursor: pointer; accent-color: #5577ff; }

    /* ── Right panel — scrollable ── */
    #right-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Custom scrollbar */
    #right-panel::-webkit-scrollbar { width: 6px; }
    #right-panel::-webkit-scrollbar-track { background: transparent; }
    #right-panel::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }

    /* ── Accordion ── */
    .accordion { border-radius: 8px; overflow: hidden; }

    .acc-header {
      width: 100%;
      background: #15151e;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #99a;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.12s, border-radius 0.15s;
      user-select: none;
    }

    .acc-header:hover { background: #1a1a28; color: #bbd; }

    .accordion.open .acc-header {
      border-radius: 8px 8px 0 0;
      border-bottom-color: transparent;
      color: #aab8cc;
    }

    .chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
      color: #445;
    }

    .accordion.open .chevron { transform: rotate(180deg); color: #667; }

    .acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.22s ease;
    }

    .accordion.open .acc-body { max-height: 2000px; }

    .acc-inner {
      background: #13131c;
      border: 1px solid #1e1e2e;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 16px;
    }

    /* ── Slider rows ── */
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row:last-child { margin-bottom: 0; }

    .row label {
      width: 86px;
      flex-shrink: 0;
      color: #778;
      white-space: nowrap;
      font-size: 12px;
    }

    .row input[type="range"] {
      flex: 1;
      height: 4px;
      cursor: pointer;
      accent-color: #5577ff;
    }

    .row select {
      flex: 1;
      background: #0d0d14;
      color: #dde;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .row select:focus { outline: none; border-color: #5577ff; }

    .row .val {
      width: 56px;
      flex-shrink: 0;
      text-align: right;
      color: #ccd;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    /* ── Color rows ── */
    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .color-row:last-child { margin-bottom: 0; }

    .color-row label { width: 86px; flex-shrink: 0; color: #778; font-size: 12px; }

    .color-row input[type="color"] {
      width: 44px;
      height: 26px;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 2px;
    }

    .color-row .hex { color: #556; font-family: monospace; font-size: 12px; }

    /* ── Emotion buttons ── */
    .emo-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .emo-btn {
      background: #18182a;
      color: #778;
      border: 1px solid #242438;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.12s, color 0.12s;
    }

    .emo-btn:hover  { background: #22223a; color: #bbd; }
    .emo-btn.active { background: #243060; border-color: #3a4a8a; color: #aac8ff; }

    /* ── Emotion param sub-grid ── */
    #emotion-params {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 20px;
    }

    #emotion-params .row { margin-bottom: 10px; }

    .sub-label {
      grid-column: 1 / -1;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #334;
      margin: 10px 0 8px;
    }

    .sub-label:first-child { margin-top: 0; }

    hr.divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid #1a1a28;
      margin: 4px 0;
    }

    /* ── Export / Load ── */
    #export-wrap, #load-wrap {
      padding: 0 0 24px;
      display: none;
    }

    #export-wrap.visible, #load-wrap.visible { display: block; }

    #export-out {
      background: #0a0a10;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      color: #7af;
      white-space: pre;
      overflow-x: auto;
      margin-top: 10px;
    }

    #load-in {
      width: 100%;
      height: 160px;
      background: #0a0a10;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #7af;
      resize: vertical;
    }

    #load-in:focus { outline: none; border-color: #5577ff; }

    #load-error {
      color: #f66;
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    .btn.primary {
      background: #1e2e58;
      border-color: #2e3e78;
      color: #8ab0ff;
      width: 100%;
      padding: 9px;
    }

    .btn.primary:hover { background: #263870; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Left: face preview ──────────────────────────────────────────── -->
  <div id="left-panel">
    <div id="canvas-wrap">
      <canvas id="face" width="240" height="282"></canvas>
      <canvas id="grid-overlay" width="240" height="282"></canvas>
    </div>

    <div id="preview-actions">
      <div class="action-row">
        <button class="btn" onclick="triggerBlink()">Blink</button>
        <button class="btn" onclick="lookLeft()">◀</button>
        <button class="btn" onclick="lookCenter()">·</button>
        <button class="btn" onclick="lookRight()">▶</button>
      </div>
      <div class="action-row">
        <button class="btn" onclick="triggerSpeak()">Speak test</button>
        <button class="btn" onclick="triggerStopSpeak()">Stop</button>
      </div>
      <label class="toggle-row">
        <input type="checkbox" id="grid-toggle" onchange="setGrid(this.checked)">
        <span>Show grid</span>
      </label>
    </div>

    <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 6px;">
      <button class="btn primary" onclick="exportConfig()">Export config JSON</button>
      <button class="btn primary" onclick="exportIndexHtml()">Export index.html</button>
      <button class="btn primary" onclick="toggleLoadPanel()">Load config JSON</button>
    </div>
  </div>

  <!-- ── Right: scrollable controls ─────────────────────────────────── -->
  <div id="right-panel">

    <!-- Emotions -->
    <div class="accordion open" id="acc-emotions">
      <button class="acc-header" onclick="toggleAcc('acc-emotions')">
        Emotions <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner">
          <div class="emo-btns" id="emo-btns"></div>
          <div id="emotion-params"></div>
        </div>
      </div>
    </div>

    <!-- Eyes -->
    <div class="accordion open" id="acc-eyes">
      <button class="acc-header" onclick="toggleAcc('acc-eyes')">
        Eyes <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" id="panel-eyes"></div>
      </div>
    </div>

    <!-- Blink -->
    <div class="accordion open" id="acc-blink">
      <button class="acc-header" onclick="toggleAcc('acc-blink')">
        Blink <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" id="panel-blink"></div>
      </div>
    </div>

    <!-- Look -->
    <div class="accordion open" id="acc-look">
      <button class="acc-header" onclick="toggleAcc('acc-look')">
        Look <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" id="panel-look"></div>
      </div>
    </div>

    <!-- Brow -->
    <div class="accordion open" id="acc-brow">
      <button class="acc-header" onclick="toggleAcc('acc-brow')">
        Brow <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner">
          <div style="display:flex; gap:6px; margin-bottom:12px;">
            <button class="btn" style="flex:1" onclick="copyBrow()">Copy brow</button>
            <button class="btn" id="paste-brow-btn" style="flex:1" onclick="pasteBrow()" disabled>Paste brow</button>
          </div>
          <div class="emo-btns" id="brow-emo-btns"></div>
          <div id="panel-brow"></div>
        </div>
      </div>
    </div>

    <!-- Mouth -->
    <div class="accordion open" id="acc-mouth">
      <button class="acc-header" onclick="toggleAcc('acc-mouth')">
        Mouth <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner">
          <div class="emo-btns" id="mouth-emo-btns"></div>
          <div id="panel-mouth"></div>
        </div>
      </div>
    </div>

    <!-- Tilt -->
    <div class="accordion" id="acc-tilt">
      <button class="acc-header" onclick="toggleAcc('acc-tilt')">
        Tilt (accelerometer) <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" id="panel-tilt"></div>
      </div>
    </div>

    <!-- Colors -->
    <div class="accordion" id="acc-colors">
      <button class="acc-header" onclick="toggleAcc('acc-colors')">
        Colors <span class="chevron">▾</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" id="panel-colors"></div>
      </div>
    </div>

    <!-- Export output -->
    <div id="export-wrap">
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button class="btn" style="flex:1" onclick="copyExport()">Copy to clipboard</button>
        <button class="btn" style="flex:1" onclick="document.getElementById('export-wrap').classList.remove('visible')">Close</button>
      </div>
      <div id="export-out"></div>
    </div>

    <!-- Load input -->
    <div id="load-wrap">
      <textarea id="load-in" placeholder='Paste config JSON here…' spellcheck="false"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn primary" style="flex:1" onclick="applyLoadedConfig()">Apply</button>
        <button class="btn" style="flex:1" onclick="toggleLoadPanel()">Cancel</button>
      </div>
      <div id="load-error"></div>
    </div>

  </div><!-- /right-panel -->
</div><!-- /app -->

<script>
  // Seed designer with whatever config is baked into index.html,
  // so the designer always starts in sync with the live face.
  window.faceConfig = {};
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'index.html', false);  // synchronous — runs before face.js
    xhr.send();
    if (xhr.status === 200) {
      const match = xhr.responseText.match(/window\.faceConfig\s*=\s*(\{[\s\S]*?\});?\s*<\/script>/);
      if (match) window.faceConfig = JSON.parse(match[1]);
    }
  } catch (e) { /* no baked config — face.js will use defaults */ }
</script>
<script src="face.js?v=0.036"></script>
<script>

// ── Accordion ─────────────────────────────────────────────────────────
function toggleAcc(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

// ── Slider schema ─────────────────────────────────────────────────────
const SCHEMA = [
  { key: 'eyeRx',      label: 'Width',        panel: 'eyes',  min: 5,    max: 80,    step: 1,    fmt: v => v + 'px' },
  { key: 'eyeRy',      label: 'Height',       panel: 'eyes',  min: 5,    max: 80,    step: 1,    fmt: v => v + 'px' },
  { key: 'eyeSpacing', label: 'Spacing',      panel: 'eyes',  min: 10,   max: 110,   step: 1,    fmt: v => v + 'px' },
  { key: 'eyeOffsetY', label: 'Y Offset',     panel: 'eyes',  min: -80,  max: 80,    step: 1,    fmt: v => v + 'px' },
  { key: 'eyeTilt',    label: 'Tilt',         panel: 'eyes',  min: 0,    max: 45,    step: 0.5,  fmt: v => v + '°'  },

  { key: 'blinkWaitMin', label: 'Wait min',   panel: 'blink', min: 200,  max: 8000,  step: 100,  fmt: v => v + 'ms' },
  { key: 'blinkWaitMax', label: 'Wait max',   panel: 'blink', min: 500,  max: 12000, step: 100,  fmt: v => v + 'ms' },

  { key: 'lookMax',         label: 'Range',        panel: 'look', min: 0,   max: 80,   step: 1,  fmt: v => v + 'px' },
  { key: 'lookDurationMin', label: 'Move dur min',  panel: 'look', min: 50,  max: 1000, step: 10, fmt: v => v + 'ms' },
  { key: 'lookDurationMax', label: 'Move dur max',  panel: 'look', min: 100, max: 2000, step: 10, fmt: v => v + 'ms' },
  { key: 'lookWaitMin',     label: 'Wait min',      panel: 'look', min: 100, max: 5000, step: 100, fmt: v => v + 'ms' },
  { key: 'lookWaitMax',     label: 'Wait max',      panel: 'look', min: 500, max: 8000, step: 100, fmt: v => v + 'ms' },
  { key: 'lookHoldMin',     label: 'Hold min',      panel: 'look', min: 50,  max: 3000, step: 50,  fmt: v => v + 'ms' },
  { key: 'lookHoldMax',     label: 'Hold max',      panel: 'look', min: 100, max: 6000, step: 100, fmt: v => v + 'ms' },

  { key: 'tiltMaxX',   label: 'Max X',      panel: 'tilt', min: 0,    max: 80,  step: 1,    fmt: v => v + 'px'     },
  { key: 'tiltMaxY',   label: 'Max Y',      panel: 'tilt', min: 0,    max: 60,  step: 1,    fmt: v => v + 'px'     },
  { key: 'tiltSmooth', label: 'Smoothing',  panel: 'tilt', min: 0.01, max: 1,   step: 0.01, fmt: v => v.toFixed(2) },
];

const SELECT_SCHEMA = [
  { key: 'blinkCloseEasing', label: 'Close curve', panel: 'blink' },
  { key: 'blinkOpenEasing',  label: 'Open curve',  panel: 'blink' },
  { key: 'lookEasing',       label: 'Move curve',  panel: 'look'  },
];

const COLOR_SCHEMA = [
  { key: 'bgColor',            label: 'Background',    panel: 'colors' },
  { key: 'eyeColor',           label: 'Eye',           panel: 'colors' },
  { key: 'browColor',          label: 'Brow',          panel: 'colors' },
  { key: 'mouthColor',         label: 'Mouth',         panel: 'colors' },
  { key: 'mouthInteriorColor', label: 'Mouth interior', panel: 'colors' },
];

// ── Input registry — for refreshing all inputs on config load ─────────
const allInputRefs = [];  // { refresh: fn } — called after config load

// ── Build sliders ─────────────────────────────────────────────────────
function makeSliderRow(key, label, min, max, step, fmt, getCurrentVal, onUpdate) {
  const val     = getCurrentVal();
  const row     = document.createElement('div'); row.className = 'row';
  const lbl     = document.createElement('label'); lbl.textContent = label;
  const input   = document.createElement('input');
  input.type    = 'range'; input.min = min; input.max = max; input.step = step; input.value = val;
  const display = document.createElement('span'); display.className = 'val'; display.textContent = fmt(val);
  input.addEventListener('input', () => {
    const n = parseFloat(input.value); onUpdate(n); display.textContent = fmt(n);
  });
  row.appendChild(lbl); row.appendChild(input); row.appendChild(display);
  allInputRefs.push({ refresh() { const v = getCurrentVal(); input.value = v; display.textContent = fmt(v); } });
  return { row, input, display, fmt };
}

function makeSelectRow(key, label, options, getCurrentVal, onUpdate) {
  const val = getCurrentVal();
  const row = document.createElement('div'); row.className = 'row';
  const lbl = document.createElement('label'); lbl.textContent = label;
  const sel = document.createElement('select');
  options.forEach(name => {
    const opt = document.createElement('option'); opt.value = name; opt.textContent = name;
    if (name === val) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => onUpdate(sel.value));
  row.appendChild(lbl); row.appendChild(sel);
  allInputRefs.push({ refresh() { sel.value = getCurrentVal(); } });
  return row;
}

function makeColorRow(key, label, getCurrentVal, onUpdate) {
  const val = getCurrentVal();
  const row = document.createElement('div'); row.className = 'color-row';
  const lbl = document.createElement('label'); lbl.textContent = label;
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = val;
  const hex = document.createElement('span'); hex.className = 'hex'; hex.textContent = val;
  inp.addEventListener('input', () => { onUpdate(inp.value); hex.textContent = inp.value; });
  row.appendChild(lbl); row.appendChild(inp); row.appendChild(hex);
  allInputRefs.push({ refresh() { const v = getCurrentVal(); inp.value = v; hex.textContent = v; } });
  return row;
}

const easingNames = Object.keys(window.FACE_EASINGS);

SCHEMA.forEach(({ key, label, panel, min, max, step, fmt }) => {
  const { row } = makeSliderRow(key, label, min, max, step, fmt,
    () => window.faceConfig[key],
    n  => { window.faceConfig[key] = n; });
  document.getElementById('panel-' + panel).appendChild(row);
});

SELECT_SCHEMA.forEach(({ key, label, panel }) => {
  const row = makeSelectRow(key, label, easingNames,
    () => window.faceConfig[key],
    v  => { window.faceConfig[key] = v; });
  document.getElementById('panel-' + panel).appendChild(row);
});

// ── Per-eye shape offsets (appended to eyes panel) ───────────────────
{
  const eyesPanel = document.getElementById('panel-eyes');
  const hr = document.createElement('hr'); hr.className = 'divider'; eyesPanel.appendChild(hr);
  const lbl = document.createElement('div'); lbl.className = 'sub-label'; lbl.textContent = 'Per-eye adjustments'; eyesPanel.appendChild(lbl);

  const deltaFmt = v => (v > 0 ? '+' : '') + v + 'px';
  const eyeOffsets = [
    { key: 'eyeRxOffsetL', label: 'Width adj L'  },
    { key: 'eyeRxOffsetR', label: 'Width adj R'  },
    { key: 'eyeRyOffsetL', label: 'Height adj L' },
    { key: 'eyeRyOffsetR', label: 'Height adj R' },
  ];
  eyeOffsets.forEach(({ key, label }) => {
    const { row } = makeSliderRow(key, label, -30, 30, 0.5, deltaFmt,
      () => window.faceConfig[key] ?? 0,
      n  => { window.faceConfig[key] = n; });
    eyesPanel.appendChild(row);
  });
}

COLOR_SCHEMA.forEach(({ key, label, panel }) => {
  const row = makeColorRow(key, label,
    () => window.faceConfig[key],
    v  => { window.faceConfig[key] = v; });
  document.getElementById('panel-' + panel).appendChild(row);
});

// ── Emotions panel ────────────────────────────────────────────────────
const EMOTION_PARAM_SCHEMA = [
  { key: 'eyeRyScale',    label: 'Eye height',  min: 0.3, max: 1.8, step: 0.05, fmt: v => Math.round(v*100)+'%' },
  { key: 'eyeYShift',     label: 'Eye Y shift', min: -20, max: 20,  step: 1,    fmt: v => v+'px'                 },
  { key: 'lidRest',       label: 'Lid rest',    min: 0,   max: 0.6, step: 0.01, fmt: v => Math.round(v*100)+'%' },
  { key: 'blinkRateMult', label: 'Blink rate',  min: 0.1, max: 3,   step: 0.1,  fmt: v => v.toFixed(1)+'×'      },
];

const MOUTH_PARAM_SCHEMA = [
  { key: 'mouthY',         label: 'Y Position', min: -20, max: 80,  step: 1,    fmt: v => v+'px'  },
  { key: 'mouthWidth',     label: 'Width',      min: 4,   max: 60,  step: 1,    fmt: v => v+'px'  },
  { key: 'mouthCurve',     label: 'Curve',      min: -15, max: 15,  step: 0.5,  fmt: v => v+'px'  },
  { key: 'mouthAngle',     label: 'Angle',      min: -30, max: 30,  step: 0.5,  fmt: v => v+'°'   },
  { key: 'mouthThickness', label: 'Thickness',  min: 0,   max: 8,   step: 0.25, fmt: v => v+'px'  },
  { key: 'mouthOpenMax',   label: 'Open max',   min: 0,   max: 40,  step: 1,    fmt: v => v+'px'  },
];

const BROW_PARAM_SCHEMA = [
  { key: 'browYOffsetL',  label: 'Y Offset L', min: -80, max: 40,  step: 1,    fmt: v => v+'px' },
  { key: 'browYOffsetR',  label: 'Y Offset R', min: -80, max: 40,  step: 1,    fmt: v => v+'px' },
  { key: 'browSpacing',   label: 'Spacing',    min: -20, max: 30,  step: 1,    fmt: v => v+'px' },
  { key: 'browCurveL',    label: 'Curve L',    min: -6,  max: 16,  step: 0.5,  fmt: v => v+'px' },
  { key: 'browCurveR',    label: 'Curve R',    min: -6,  max: 16,  step: 0.5,  fmt: v => v+'px' },
  { key: 'browAngle',     label: 'Angle',      min: -20, max: 20,  step: 0.5,  fmt: v => v+'°'  },
  { key: 'browXSpan',     label: 'Width',      min: 5,   max: 44,  step: 1,    fmt: v => v+'px' },
  { key: 'browThickness', label: 'Thickness',  min: 0,   max: 8,   step: 0.25, fmt: v => v+'px' },
];

let selectedEmotion = 'neutral';
const emoSliderRefs   = {};  // key → {input, display, fmt} for emotion params
const browSliderRefs  = {};  // key → {input, display, fmt} for brow params
const mouthSliderRefs = {};  // key → {input, display, fmt} for mouth params

function makeEmoBtns(containerId, prefix) {
  const wrap = document.getElementById(containerId);
  window.FACE_EMOTION_NAMES.forEach(name => {
    const btn = document.createElement('button');
    btn.className   = 'emo-btn' + (name === selectedEmotion ? ' active' : '');
    btn.textContent = name.charAt(0).toUpperCase() + name.slice(1);
    btn.id          = prefix + name;
    btn.addEventListener('click', () => switchEmotion(name));
    wrap.appendChild(btn);
  });
}

function buildEmotionPanel() {
  makeEmoBtns('emo-btns', 'emo-btn-');
  const paramsWrap = document.getElementById('emotion-params');

  EMOTION_PARAM_SCHEMA.forEach(s => {
    const { row, input, display, fmt } = makeSliderRow(
      s.key, s.label, s.min, s.max, s.step, s.fmt,
      () => window.faceConfig.emotions[selectedEmotion][s.key],
      n  => {
        window.faceConfig.emotions[selectedEmotion][s.key] = n;
        if (window.__faceDebug?.getEmotion() === selectedEmotion) window.__faceDebug.setEmotion(selectedEmotion);
      }
    );
    emoSliderRefs[s.key] = { input, display, fmt };
    paramsWrap.appendChild(row);
  });

  // Transition controls
  const hr = document.createElement('hr'); hr.className = 'divider'; paramsWrap.appendChild(hr);
  const tLbl = document.createElement('div'); tLbl.className = 'sub-label'; tLbl.textContent = 'Transition'; paramsWrap.appendChild(tLbl);
  const { row: durRow } = makeSliderRow('transitionDuration', 'Duration', 50, 2000, 50,
    v => v+'ms', () => window.faceConfig.transitionDuration, n => { window.faceConfig.transitionDuration = n; });
  paramsWrap.appendChild(durRow);
  paramsWrap.appendChild(makeSelectRow('transitionEasing', 'Curve', easingNames,
    () => window.faceConfig.transitionEasing, v => { window.faceConfig.transitionEasing = v; }));
}

function buildBrowPanel() {
  makeEmoBtns('brow-emo-btns', 'brow-btn-');
  const wrap = document.getElementById('panel-brow');

  BROW_PARAM_SCHEMA.forEach(s => {
    const { row, input, display, fmt } = makeSliderRow(
      s.key, s.label, s.min, s.max, s.step, s.fmt,
      () => window.faceConfig.emotions[selectedEmotion][s.key],
      n  => {
        window.faceConfig.emotions[selectedEmotion][s.key] = n;
        if (window.__faceDebug?.getEmotion() === selectedEmotion) window.__faceDebug.setEmotion(selectedEmotion);
      }
    );
    browSliderRefs[s.key] = { input, display, fmt };
    wrap.appendChild(row);
  });
}

function switchEmotion(name) {
  // Update all emotion button sets
  document.querySelectorAll('.emo-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`#emo-btn-${name}, #brow-btn-${name}, #mouth-btn-${name}`).forEach(b => b.classList.add('active'));

  selectedEmotion = name;
  const preset = window.faceConfig.emotions[name];

  // Sync emotion sliders
  EMOTION_PARAM_SCHEMA.forEach(({ key }) => {
    const ref = emoSliderRefs[key];
    if (ref) { ref.input.value = preset[key]; ref.display.textContent = ref.fmt(preset[key]); }
  });

  // Sync brow sliders
  BROW_PARAM_SCHEMA.forEach(({ key }) => {
    const ref = browSliderRefs[key];
    if (ref) { ref.input.value = preset[key]; ref.display.textContent = ref.fmt(preset[key]); }
  });

  // Sync mouth sliders
  MOUTH_PARAM_SCHEMA.forEach(({ key }) => {
    const ref = mouthSliderRefs[key];
    if (ref) { ref.input.value = preset[key]; ref.display.textContent = ref.fmt(preset[key]); }
  });

  window.__faceDebug?.setEmotion(name);
}

function buildMouthPanel() {
  makeEmoBtns('mouth-emo-btns', 'mouth-btn-');
  const wrap = document.getElementById('panel-mouth');

  MOUTH_PARAM_SCHEMA.forEach(s => {
    const { row, input, display, fmt } = makeSliderRow(
      s.key, s.label, s.min, s.max, s.step, s.fmt,
      () => window.faceConfig.emotions[selectedEmotion][s.key],
      n  => {
        window.faceConfig.emotions[selectedEmotion][s.key] = n;
        if (window.__faceDebug?.getEmotion() === selectedEmotion) window.__faceDebug.setEmotion(selectedEmotion);
      }
    );
    mouthSliderRefs[s.key] = { input, display, fmt };
    wrap.appendChild(row);
  });
}

// ── Blink profiles panel ──────────────────────────────────────────────
const PROFILE_LABELS = ['Quick', 'Normal', 'Slow'];

function buildBlinkProfiles() {
  const panel = document.getElementById('panel-blink');

  const hr = document.createElement('hr'); hr.className = 'divider'; panel.appendChild(hr);
  const lbl = document.createElement('div'); lbl.className = 'sub-label'; lbl.textContent = 'Speed profiles'; panel.appendChild(lbl);

  const profileFields = [
    { key: 'close', label: 'Close', fmt: v => v + 'ms', min: 10, max: 400, step: 5 },
    { key: 'hold',  label: 'Hold',  fmt: v => v + 'ms', min: 0,  max: 300, step: 5 },
    { key: 'open',  label: 'Open',  fmt: v => v + 'ms', min: 10, max: 500, step: 5 },
  ];

  window.faceConfig.blinkProfiles.forEach((profile, i) => {
    const pLbl = document.createElement('div'); pLbl.className = 'sub-label';
    pLbl.textContent = 'Profile ' + (i + 1) + ' — ' + PROFILE_LABELS[i];
    panel.appendChild(pLbl);

    profileFields.forEach(({ key, label, fmt, min, max, step }) => {
      const { row } = makeSliderRow(
        'blinkProfiles.' + i + '.' + key, label, min, max, step, fmt,
        () => window.faceConfig.blinkProfiles[i][key],
        n  => { window.faceConfig.blinkProfiles[i][key] = n; }
      );
      panel.appendChild(row);
    });
  });
}

buildEmotionPanel();
buildBrowPanel();
buildMouthPanel();
buildBlinkProfiles();

// ── Debug buttons ─────────────────────────────────────────────────────
function triggerBlink()     { window.__faceDebug?.blink(); }
function lookLeft()         { window.__faceDebug?.look(-window.faceConfig.lookMax); }
function lookRight()        { window.__faceDebug?.look( window.faceConfig.lookMax); }
function lookCenter()       { window.__faceDebug?.look(0); }
function triggerSpeak()     { window.__faceDebug?.speakText('Hey there, how are you doing today? I am doing pretty well, thanks for asking.'); }
function triggerStopSpeak() { window.__faceDebug?.stopSpeaking(); }

// ── Grid overlay ──────────────────────────────────────────────────────
const gridCanvas = document.getElementById('grid-overlay');
const gridCtx    = gridCanvas.getContext('2d');
const GW = 240, GH = 282;

function drawGrid() {
  gridCtx.clearRect(0, 0, GW, GH);
  gridCtx.strokeStyle = 'rgba(255,255,255,0.08)';
  gridCtx.lineWidth   = 0.5;
  for (let x = 0; x <= GW; x += 20) { gridCtx.beginPath(); gridCtx.moveTo(x,0); gridCtx.lineTo(x,GH); gridCtx.stroke(); }
  for (let y = 0; y <= GH; y += 20) { gridCtx.beginPath(); gridCtx.moveTo(0,y); gridCtx.lineTo(GW,y); gridCtx.stroke(); }
  gridCtx.strokeStyle = 'rgba(100,160,255,0.2)';
  gridCtx.lineWidth   = 0.75;
  [GW/3, GW*2/3].forEach(x => { gridCtx.beginPath(); gridCtx.moveTo(x,0); gridCtx.lineTo(x,GH); gridCtx.stroke(); });
  [GH/3, GH*2/3].forEach(y => { gridCtx.beginPath(); gridCtx.moveTo(0,y); gridCtx.lineTo(GW,y); gridCtx.stroke(); });
  gridCtx.strokeStyle = 'rgba(255,100,100,0.35)';
  gridCtx.lineWidth   = 1;
  gridCtx.beginPath(); gridCtx.moveTo(GW/2,0); gridCtx.lineTo(GW/2,GH); gridCtx.stroke();
  gridCtx.beginPath(); gridCtx.moveTo(0,GH/2); gridCtx.lineTo(GW,GH/2); gridCtx.stroke();
}

function setGrid(on) { if (on) drawGrid(); else gridCtx.clearRect(0, 0, GW, GH); }

// ── Brow copy / paste ─────────────────────────────────────────────────
const BROW_KEYS = ['browYOffsetL', 'browYOffsetR', 'browSpacing', 'browCurveL', 'browCurveR', 'browAngle', 'browXSpan', 'browThickness'];
let browClipboard = null;

function copyBrow() {
  const preset = window.faceConfig.emotions[selectedEmotion];
  browClipboard = {};
  BROW_KEYS.forEach(k => { browClipboard[k] = preset[k]; });
  const btn = document.getElementById('paste-brow-btn');
  btn.disabled = false;
  btn.textContent = 'Paste brow';
  // Brief feedback on copy button
  const copy = event.target;
  const orig = copy.textContent;
  copy.textContent = 'Copied!';
  setTimeout(() => { copy.textContent = orig; }, 1200);
}

function pasteBrow() {
  if (!browClipboard) return;
  const preset = window.faceConfig.emotions[selectedEmotion];
  BROW_KEYS.forEach(k => { preset[k] = browClipboard[k]; });
  // Refresh brow sliders
  BROW_PARAM_SCHEMA.forEach(({ key }) => {
    const ref = browSliderRefs[key];
    if (ref) { ref.input.value = preset[key]; ref.display.textContent = ref.fmt(preset[key]); }
  });
  // Re-apply to face if active
  if (window.__faceDebug?.getEmotion() === selectedEmotion) window.__faceDebug.setEmotion(selectedEmotion);
}

// ── Export index.html ─────────────────────────────────────────────────
async function exportIndexHtml() {
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = 'Building…';
  btn.disabled = true;

  try {
    const res  = await fetch('index.html');
    const html = await res.text();

    const inject = `<script>\n  window.faceConfig = ${JSON.stringify(window.faceConfig, null, 2)};\n<\/script>\n`;
    const patched = html.replace(/(<script\s[^>]*face\.js[^>]*><\/script>)/, inject + '$1');

    const blob = new Blob([patched], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export failed: ' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

// ── Export ────────────────────────────────────────────────────────────
function exportConfig() {
  document.getElementById('load-wrap').classList.remove('visible');
  const out  = document.getElementById('export-out');
  const wrap = document.getElementById('export-wrap');
  out.textContent = JSON.stringify(window.faceConfig, null, 2);
  wrap.classList.add('visible');
  out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyExport() {
  const text = document.getElementById('export-out').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

// ── Load ──────────────────────────────────────────────────────────────
function toggleLoadPanel() {
  document.getElementById('export-wrap').classList.remove('visible');
  const wrap = document.getElementById('load-wrap');
  const isVisible = wrap.classList.toggle('visible');
  if (isVisible) {
    document.getElementById('load-in').value = '';
    document.getElementById('load-error').textContent = '';
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => document.getElementById('load-in').focus(), 220);
  }
}

function applyLoadedConfig() {
  const raw = document.getElementById('load-in').value.trim();
  const err = document.getElementById('load-error');
  err.textContent = '';
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { err.textContent = 'Invalid JSON: ' + e.message; return; }
  if (typeof parsed !== 'object' || parsed === null) { err.textContent = 'Expected a JSON object.'; return; }

  // Deep merge into faceConfig
  Object.assign(window.faceConfig, parsed);
  if (parsed.emotions) {
    window.faceConfig.emotions = window.faceConfig.emotions || {};
    Object.assign(window.faceConfig.emotions, parsed.emotions);
  }
  if (Array.isArray(parsed.blinkProfiles)) {
    window.faceConfig.blinkProfiles = parsed.blinkProfiles;
  }

  // Refresh all registered inputs
  allInputRefs.forEach(r => r.refresh());

  // Refresh emotion + brow sliders for currently selected emotion
  switchEmotion(selectedEmotion);

  // Re-apply current emotion to face
  window.__faceDebug?.setEmotion(window.__faceDebug.getEmotion());

  document.getElementById('load-wrap').classList.remove('visible');
}
